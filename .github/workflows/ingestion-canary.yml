name: ingestion-canary

# Daily canary: run the full real-data pipeline against live Naver to prove
# ingestion still works end-to-end. GitHub runners are ephemeral, so this uses a
# throwaway SQLite DB unless a KBO_DATABASE_URL repo secret is configured (in which
# case results persist). `kbo-lab run` exits non-zero on a genuine failure (broken
# source or pipeline), so this workflow fails and alerts. A KBO off-day with no LG
# game scheduled is NOT a failure: ingestion completes with nothing to analyse and
# exits 0, keeping the canary green so real breakage still stands out.

on:
  schedule:
    # 18:00 UTC = 03:00 KST — ingest the KST day whose games have finished.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "ISO date to ingest (YYYY-MM-DD). Defaults to yesterday (KST)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ingest:
    name: kbo-lab run (live Naver)
    runs-on: ubuntu-latest
    env:
      KBO_DATABASE_URL: ${{ secrets.KBO_DATABASE_URL || 'sqlite:////tmp/kbo_lineup_lab_canary.db' }}
      # LLM batting-order layer. Falls back to the deterministic order on any
      # failure, so a missing key or OpenAI outage never fails the canary.
      LINEUP_LLM_ENABLED: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LINEUP_LLM_MODEL: gpt-5.5
      # gpt-5.5 reasoning runs take ~30s; keep well above to avoid silent fallback.
      LINEUP_LLM_TIMEOUT_S: "60"
      # Postgame storytelling narrative: same gpt-5.5 model, best-effort.
      POSTGAME_NARRATIVE_ENABLED: "true"
      POSTGAME_NARRATIVE_MODEL: gpt-5.5
      POSTGAME_NARRATIVE_TIMEOUT_S: "60"
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Resolve target date (yesterday KST unless provided)
        id: date
        env:
          # Pass the user-controlled dispatch input via env (never interpolate
          # ${{ }} directly into the shell) to avoid script injection.
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "value=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(TZ=Asia/Seoul date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ingestion pipeline (kbo-lab run)
        run: cd apps/api && uv run kbo-lab run --date "${{ steps.date.outputs.value }}"
